<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Product Shelf{% endblock %}</title>
    <style>
        :root { --ink: #17212b; --muted: #687581; --paper: #f5f1e9; --accent: #d85b3f; --line: #ddd4c7; }
        * { box-sizing: border-box; }
        body { margin: 0; color: var(--ink); background: var(--paper); font-family: Georgia, 'Times New Roman', serif; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 1.25rem 6vw; border-bottom: 1px solid var(--line); }
        header a { color: var(--ink); text-decoration: none; }
        .brand { font-size: 1.25rem; font-weight: bold; letter-spacing: .04em; }
        nav { display: flex; gap: 1rem; align-items: center; font-family: Arial, sans-serif; font-size: .9rem; }
        main { max-width: 1100px; margin: 0 auto; padding: 5rem 6vw; }
        h1 { max-width: 680px; margin: 0 0 .75rem; font-size: clamp(2.5rem, 7vw, 5.8rem); line-height: .95; font-weight: normal; }
        .intro { color: var(--muted); font: 1rem/1.6 Arial, sans-serif; margin-bottom: 3rem; }
        .products { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; }
        .product { display: flex; min-height: 220px; flex-direction: column; justify-content: space-between; padding: 1.4rem; border: 1px solid var(--line); background: #fbf9f4; }
        .product h2 { margin: 0 0 .5rem; font-size: 1.5rem; font-weight: normal; }
        .meta { color: var(--muted); font: .85rem Arial, sans-serif; }
        .price { margin: 1.5rem 0; font-size: 1.5rem; }
        button, .button { border: 0; padding: .75rem 1rem; color: white; background: var(--accent); cursor: pointer; font: bold .85rem Arial, sans-serif; text-decoration: none; }
        button:disabled { opacity: .45; cursor: not-allowed; }
        .messages { padding: 0; list-style: none; font: .9rem Arial, sans-serif; }
        .messages li { padding: .8rem 1rem; margin-bottom: .5rem; background: #e7eee5; }
        .messages .error { background: #f5dcd5; }
        form.auth { max-width: 420px; font: .95rem Arial, sans-serif; }
        form.auth p { display: grid; gap: .4rem; }
        form.auth input { width: 100%; padding: .7rem; border: 1px solid var(--line); }
        .helptext, .errorlist { color: var(--muted); font-size: .8rem; }
        @media (max-width: 600px) { header { align-items: flex-start; gap: 1rem; flex-direction: column; } main { padding-top: 3rem; } }
    </style>
</head>
<body>
    <header>
        <a class="brand" href="{% url 'students:product_list' %}">PRODUCT SHELF</a>
        <nav>
            {% if user.is_authenticated %}
                <span>{{ user.username }}</span>
                <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button type="submit">Log out</button></form>
            {% else %}
                <a href="{% url 'login' %}">Log in</a>
                <a class="button" href="{% url 'students:register' %}">Register</a>
            {% endif %}
        </nav>
    </header>
    <main>
        {% if messages %}<ul class="messages">{% for message in messages %}<li class="{{ message.tags }}">{{ message }}</li>{% endfor %}</ul>{% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
