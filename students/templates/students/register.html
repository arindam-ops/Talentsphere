{% extends 'students/base.html' %}
{% block title %}Register | Product Shelf{% endblock %}
{% block content %}
<h1>Create an account.</h1>
<p class="intro">Register once, then you can purchase any available product.</p>
<form class="auth" method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Create account</button>
</form>
{% endblock %}
