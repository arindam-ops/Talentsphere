{% extends 'students/base.html' %}
{% block title %}Log in | Product Shelf{% endblock %}
{% block content %}
<h1>Welcome back.</h1>
<form class="auth" method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Log in</button>
</form>
{% endblock %}
